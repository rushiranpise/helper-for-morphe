files:
  # Both paths are relative to the repository and deliberately have no leading slash: with one,
  # the download writes to that path from the filesystem root instead of from the checkout, so
  # the files land outside the working tree and git has nothing to commit.
  - source: app/src/main/res/values/strings.xml
    translation: app/src/main/res/values-%android_code%/%original_file_name%

    # No `languages_mapping` yet, and that is the correct state rather than an omission: the app
    # has no translations and the Crowdin project has no target languages, so nothing is exported
    # and there is nothing to map.
    #
    # It becomes necessary with the first language. Crowdin's own Android code for a language is
    # regional - German is `de-rDE`, French is `fr-rFR` - so Android's placeholder would write
    # `values-de-rDE` next to the `values-de` this app would want. The mapping is a line per
    # language saying which code the placeholder should produce:
    #
    #   languages_mapping:
    #     android_code:
    #       de: de
    #       pt-BR: pt-rBR
    #
    # Without it, a language arrives as a folder the app does not carry and the pull request that
    # brings it is refused - which is the guard working, not a failure.
