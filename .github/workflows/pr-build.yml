name: PR build

# The repository owner comments /build on a pull request to run this. Nothing
# runs on a push, and the build job never receives the production signing key.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build PR APKs
    if: >-
      github.event.issue.pull_request != null &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/build')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr_number: ${{ steps.pr.outputs.number }}
      head_sha: ${{ steps.pr.outputs.sha }}

    steps:
      - name: Resolve pull request head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"

          if [[ -z "$sha" ]]; then
            echo "::error::Could not resolve the pull request head."
            exit 1
          fi

          {
            echo "number=${PR_NUMBER}"
            echo "sha=${sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ steps.pr.outputs.number }}/head
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create temporary signing key
        id: signing
        shell: bash
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          store="$RUNNER_TEMP/pr-release.jks"
          keytool -genkeypair \
            -keystore "$store" \
            -storepass "$password" \
            -keypass "$password" \
            -alias pr-build \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=PR build, OU=Helper, O=Morphe, C=US" \
            -noprompt
          echo "store=$store" >> "$GITHUB_OUTPUT"
          echo "password=$password" >> "$GITHUB_OUTPUT"

      - name: Build debug and release APKs
        env:
          HELPER_RELEASE_STORE_FILE: ${{ steps.signing.outputs.store }}
          HELPER_RELEASE_STORE_PASSWORD: ${{ steps.signing.outputs.password }}
          HELPER_RELEASE_KEY_ALIAS: pr-build
          HELPER_RELEASE_KEY_PASSWORD: ${{ steps.signing.outputs.password }}
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease

      - name: Collect APKs
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          rm -rf dist
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/pr-${PR_NUMBER}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/pr-${PR_NUMBER}-release.apk"
          ls -l dist

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: pr-apks
          path: |
            dist/pr-*-debug.apk
            dist/pr-*-release.apk
          retention-days: 7

  publish:
    name: Publish APKs and comment
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: pr-apks
          path: dist

      - name: Publish test build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view ci-pr-builds >/dev/null 2>&1; then
            gh release create ci-pr-builds \
              --prerelease \
              --title "PR test builds" \
              --notes "Automated test builds triggered by the repository owner. These APKs are not signed with the production key." \
              --target "$GITHUB_SHA"
          fi

          gh release upload ci-pr-builds dist/*.apk --clobber

      - name: Comment links on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.build.outputs.pr_number }}
          HEAD_SHA: ${{ needs.build.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          short_sha="${HEAD_SHA:0:7}"
          body="$(cat <<EOF
          <!-- helper-pr-build -->
          **Test build for \`${short_sha}\` is ready.**

          - [Debug APK](https://github.com/${GITHUB_REPOSITORY}/releases/download/ci-pr-builds/pr-${PR_NUMBER}-debug.apk)
          - [Release APK](https://github.com/${GITHUB_REPOSITORY}/releases/download/ci-pr-builds/pr-${PR_NUMBER}-release.apk)

          The release APK is signed with a temporary CI key, not the production key. Uninstall a production build before installing it.

          Comment \`/build\` again after new commits to refresh these links. [Workflow run](${RUN_URL})
          EOF
          )"

          comment_id="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- helper-pr-build -->"))) | .id' \
            | tail -n 1)"

          if [[ -n "$comment_id" ]]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body" >/dev/null
          fi
